name: Nightly Module

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Install deps
      run: sudo apt update && sudo apt install -y --no-install-recommends gcc g++ git cmake curl ninja-build
    - name: Checkout submodules
      run: git submodule update --init --recursive
    - name: Config to use https in case ssh isn't setup
      run: git config --global url."https://github.com/".insteadOf "git@github.com:"
    - name: Install wasi sdk
      run: |
        WASI_OS=linux
        WASI_ARCH=x86_64
        WASI_VERSION=34
        WASI_VERSION_FULL=${WASI_VERSION}.0
        wget https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_VERSION}/wasi-sdk-${WASI_VERSION_FULL}-${WASI_ARCH}-${WASI_OS}.tar.gz
        tar xvf wasi-sdk-${WASI_VERSION_FULL}-${WASI_ARCH}-${WASI_OS}.tar.gz
        sudo mkdir -p /opt/wasi-sdk
        sudo mv wasi-sdk-${WASI_VERSION_FULL}-${WASI_ARCH}-${WASI_OS}/* /opt/wasi-sdk/
    - name: Clone libpak
      run: |
        git clone https://github.com/petabyt/libpak.git --depth 1 --recurse-submodules /tmp/libpak
    - name: Compile module
      run: |
        cmake -DCMAKE_TOOLCHAIN_FILE=/tmp/libpak/toolchain/toolchain.cmake \
          -DMAKE_EXECUTABLE=ON \
          -DCMAKE_PROJECT_INCLUDE=/tmp/libpak/toolchain/pakrt.cmake \
          -DCMAKE_BUILD_TYPE=Release \
          -DPTP_NO_USB=ON \
          -DLIBFUJI_MODULE=ON \
          -G Ninja -B build
        cmake --build build
        mv build/fuji build/libfuji.wasm
    - name: Upload Latest Pre-release
      if: github.event_name != 'pull_request'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "build/libfuji.wasm, libfuji.json"
        tag: "latest"
        name: "Nightly WASM Build"
        bodyFile: ".github/workflows/nightly.txt"
        prerelease: false
        allowUpdates: true
        replacesArtifacts: true
        commit: ${{ github.sha }}
        token: ${{ secrets.GITHUB_TOKEN }}
